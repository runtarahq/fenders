[package]
name = "fenders-demo-components"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
[lib]
crate-type = ["cdylib"]
[[bin]]
name = "hello-command"
path = "src/command.rs"
[dependencies]
wasi = "=0.14.4"
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

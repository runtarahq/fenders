# Advisories `cargo audit` reports and this repository cannot act on yet. Each
# needs a release of a dependency that does not exist; take an entry out when
# it does. CI fails on any advisory not listed here.
[advisories]
ignore = [
    # rsa 0.9: timing side channel in private-key operations (Marvin). Here
    # through openidconnect, which uses it to verify an identity provider's
    # signatures with public keys: no private key is held. No fixed release
    # that openidconnect 4 accepts.
    "RUSTSEC-2023-0071",
    # crypto-bigint 0.5: timing variability. Here through p256 0.13 under
    # openidconnect, again for verification only. Fixed in 0.7, which p256
    # 0.13 does not take.
    "RUSTSEC-2026-0387",
    # libsqlite3-sys 0.30 (bundled SQLite). sqlx 0.8 pins this version for
    # every crate in the graph. The node opens only its own journal with it:
    # no SQL or database file from a tenant reaches it.
    "RUSTSEC-2026-0459",
]

[package]
default-run = "fenders-node"
name = "fenders-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fenders-egress = { path = "../fenders-egress" }
fenders-service-trust = { path = "../fenders-service-trust" }
fenders-node-protocol = { path = "../fenders-node-protocol" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
axum.workspace = true
clap.workspace = true
url = "2"
libc = "0.2"
libloading = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
tempfile = "3"
subtle = "2"
wat = "=1.239.0"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
x509-parser = "0.16"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[dev-dependencies]
# Integration fixtures drive the real control-plane store and PKI.
fenders-control-plane = { path = "../fenders-control-plane" }
fenders-component = { path = "../fenders-component" }
sqlx.workspace = true
time = "0.3"

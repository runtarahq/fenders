[package]
name = "fenders-shim"
version = "0.1.2"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "fenders-shim"
path = "src/main.rs"

# A local stand-in for a run channel endpoint, for testing the shim alone.
[[bin]]
name = "fenders-shim-stub"
path = "src/bin/stub.rs"

[dependencies]
fenders-node = { path = "../fenders-node" }
fenders-node-protocol = { path = "../fenders-node-protocol" }
serde_json.workspace = true
tracing = "0.1"
sha2.workspace = true
tokio = { workspace = true, features = ["process"] }
libc = "0.2"
url = "2"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1", "http2"] }
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
base64 = "0.22"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"

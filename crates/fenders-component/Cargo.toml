[package]
name = "fenders-component"
version = "0.1.1"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
wasmparser = "=0.261.0"
wasmtime = { version = "=50.0.3", default-features = false, features = ["anyhow", "std", "cranelift", "parallel-compilation", "runtime", "component-model", "component-model-async", "async", "incremental-cache"] }
wasmtime-wasi = { version = "=50.0.3", default-features = false, features = ["p2", "p3"] }
wasmtime-wasi-http = "=50.0.3"

[dev-dependencies]
fenders-runtime-limits = { path = "../fenders-runtime-limits" }
tempfile = "3"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
wat = "=1.239.0"
tokio.workspace = true

[package]
name = "fenders-node-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Shared by the control plane and the node agent. No database, OIDC or SMTP
# dependencies belong here; the node must build without them.
[dependencies]
axum.workspace = true
tokio.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
url = "2"
base64 = "0.22"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc"] }
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
http-body-util = "0.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = "=0.10.4"

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"

[package]
default-run = "fenders-control-plane"
name = "fenders-control-plane"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fenders-egress = { path = "../fenders-egress" }
fenders-node-protocol = { path = "../fenders-node-protocol" }
hickory-resolver = { version = "=0.26.3", default-features = false, features = ["tokio", "tls-ring"] }
webpki-roots = "1"
axum = { workspace = true, features = ["ws"] }
http-body = "1"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio", "service", "server-auto", "http1", "http2"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
sha2.workspace = true
clap.workspace = true
fernet = { version = "=0.2.2", default-features = false, features = ["rustcrypto"] }
libc = "0.2"
url = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
base64 = "0.22"
ipnet = { version = "2", features = ["serde"] }
aes-gcm = "0.10"
hkdf = "0.12"
tar = "0.4"
tempfile = "3"
rcgen = { version = "0.13", features = ["x509-parser"] }
time = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = "=0.10.4"
# Auth0 profile claims may serialize updated_at as RFC 3339.
openidconnect = { version = "=4.1.0", default-features = false, features = ["accept-rfc3339-timestamps"] }
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }

[dev-dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }
tokio = { workspace = true, features = ["process", "test-util"] }
fenders-component = { path = "../fenders-component" }
wat = "=1.239.0"
tower = { version = "=0.5.3", features = ["util"] }
tempfile = "3"
# Only for tests/rsa_verify_only.rs: the workspace patches this crate.
rsa = { version = "0.9", features = ["getrandom"] }
